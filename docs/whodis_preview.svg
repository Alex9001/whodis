<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020711"/>
      <stop offset="0.55" stop-color="#071225"/>
      <stop offset="1" stop-color="#0b0d2b"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19c8ff"/>
      <stop offset="0.54" stop-color="#23e0d0"/>
      <stop offset="1" stop-color="#a65cff"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1ac9ff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#a65cff" stop-opacity="0.34"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2bb9eb" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000814" flood-opacity="0.8"/>
    </filter>
    <clipPath id="logoClip"><circle cx="1004" cy="280" r="232"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1030" cy="250" r="300" fill="#006eff" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1120" cy="390" r="230" fill="#9a3dff" opacity="0.11" filter="url(#glow)"/>
  <path d="M735 -40L1280 120V640H995Z" fill="#0d1c3b" opacity="0.62"/>
  <path d="M810 -30L1280 108" fill="none" stroke="#20c8ff" stroke-opacity="0.18" stroke-width="2"/>

  <g transform="translate(62 52)">
    <image x="0" y="0" width="78" height="78" xlink:href="whodis_logo.png"/>
    <text x="98" y="58" font-family="DejaVu Sans, sans-serif" font-size="58" font-weight="700" fill="url(#word)">whodis</text>
  </g>

  <text x="64" y="195" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700" fill="#f3f8ff">A full domain investigation suite.</text>
  <text x="66" y="237" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#9fb4ca">Identity · DNS · diagnostics · infrastructure · technology</text>

  <g font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600">
    <g transform="translate(64 275)">
      <rect width="142" height="42" rx="10" fill="#071a2c" stroke="#21c9ff" stroke-opacity="0.7"/>
      <circle cx="22" cy="21" r="5" fill="#25d5ff"/>
      <text x="38" y="27" fill="#dceeff">IDENTITY</text>
    </g>
    <g transform="translate(218 275)">
      <rect width="190" height="42" rx="10" fill="#071a2c" stroke="#2ee6c8" stroke-opacity="0.65"/>
      <circle cx="22" cy="21" r="5" fill="#2ee6c8"/>
      <text x="38" y="27" fill="#dceeff">DNS · DIAGNOSE</text>
    </g>
    <g transform="translate(420 275)">
      <rect width="196" height="42" rx="10" fill="#0d1730" stroke="#a164ff" stroke-opacity="0.65"/>
      <circle cx="22" cy="21" r="5" fill="#a164ff"/>
      <text x="38" y="27" fill="#e9e3ff">STACK · RESEARCH</text>
    </g>
  </g>

  <g transform="translate(64 347)" filter="url(#shadow)">
    <rect width="576" height="208" rx="15" fill="#030a15" stroke="url(#stroke)" stroke-width="1.5"/>
    <rect x="1" y="1" width="574" height="38" rx="14" fill="#0a1423"/>
    <circle cx="21" cy="20" r="5" fill="#ff5f57"/>
    <circle cx="39" cy="20" r="5" fill="#febc2e"/>
    <circle cx="57" cy="20" r="5" fill="#28c840"/>
    <text x="432" y="25" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#66839f">whodis</text>
    <g font-family="DejaVu Sans Mono, monospace" font-size="17">
      <text x="24" y="75" fill="#30e0c0">$</text>
      <text x="47" y="75" fill="#f5f8ff">whodis cyberbrand.net</text>
      <text x="24" y="112" fill="#4acfff">╭─ Registration ─────────────────────────────╮</text>
      <text x="24" y="141" fill="#8fa8bf">│</text>
      <text x="51" y="141" fill="#7d9ab5">Name</text>
      <text x="170" y="141" fill="#f4f8ff">cyberbrand.net</text>
      <text x="542" y="141" fill="#8fa8bf">│</text>
      <text x="24" y="169" fill="#8fa8bf">│</text>
      <text x="51" y="169" fill="#7d9ab5">Protocol</text>
      <text x="170" y="169" fill="#2ee6c8">RDAP</text>
      <text x="542" y="169" fill="#8fa8bf">│</text>
      <text x="24" y="198" fill="#4acfff">╰────────────────────────────────────────────╯</text>
    </g>
  </g>

  <g clip-path="url(#logoClip)" filter="url(#shadow)">
    <image x="770" y="45" width="468" height="468" xlink:href="whodis_logo.png"/>
  </g>
  <circle cx="1004" cy="280" r="232" fill="none" stroke="url(#stroke)" stroke-width="2" opacity="0.5"/>

  <g transform="translate(747 533)" font-family="DejaVu Sans, sans-serif">
    <rect width="468" height="58" rx="14" fill="#071222" stroke="#2b9fdb" stroke-opacity="0.42"/>
    <text x="24" y="25" font-size="15" font-weight="700" fill="#45d3ff">CLI + NATIVE GUI</text>
    <text x="24" y="46" font-size="14" fill="#9db1c6">Linux · macOS · Windows · MIT · No telemetry</text>
  </g>
