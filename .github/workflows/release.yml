name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version identity used by non-publishing preflight packages
        required: true
        default: 2.5.1
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GO_VERSION: 1.26.6
  GORELEASER_VERSION: v2.17.1
  SYFT_VERSION: v1.51.0
  WHODIS_BUILD_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  gui-linux:
    name: Build Linux GUI (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            tool_arch: x86_64
            linuxdeploy_sha256: 421ca71d5c69ea97c6309276232990d43df1dcece0edfaa26bbf926ff96ed12e
            qt_plugin_sha256: cfc1055b2b9dbc08412b579f20990b7b41a17b61beaa5847dc9477c96c9e9617
          - runner: ubuntu-22.04-arm
            arch: arm64
            tool_arch: aarch64
            linuxdeploy_sha256: 9f04c4c2a8b69c392c4bbcc1a88bdd4d0a8ac03f587cf5242814cb7ae47b78e5
            qt_plugin_sha256: d5b5a9020065cefda8c7af7c9500f686b23640eac50c88201a81752c6ee2e49c
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-tools-dev-tools qt6-wayland libgl1-mesa-dev libfuse2 file weston xauth xvfb
      - name: Install linuxdeploy
        env:
          LINUXDEPLOY_SHA256: ${{ matrix.linuxdeploy_sha256 }}
          QT_PLUGIN_SHA256: ${{ matrix.qt_plugin_sha256 }}
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.tool_arch }}.AppImage"
          curl --fail --location --retry 3 --retry-all-errors \
            --output linuxdeploy-plugin-qt \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.tool_arch }}.AppImage"
          printf '%s  %s\n' "$LINUXDEPLOY_SHA256" linuxdeploy | sha256sum --check --strict
          printf '%s  %s\n' "$QT_PLUGIN_SHA256" linuxdeploy-plugin-qt | sha256sum --check --strict
          chmod +x linuxdeploy linuxdeploy-plugin-qt
      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Build AppImage
        env:
          LINUXDEPLOY: ${{ github.workspace }}/linuxdeploy
          QMAKE: qmake6
        run: |
          mkdir -p release-assets
          scripts/package-gui-linux.sh "$WHODIS_BUILD_VERSION" build-gui release-assets
          syft dir:build-gui/AppDir \
            --output "spdx-json=release-assets/whodis-gui_linux_${{ matrix.arch }}.sbom.json"
          jq --exit-status '.packages | length >= 10' \
            "release-assets/whodis-gui_linux_${{ matrix.arch }}.sbom.json"
          grep -qi whodis "release-assets/whodis-gui_linux_${{ matrix.arch }}.sbom.json"
          find build-gui/AppDir -type f -iname '*Qt6Core*' -print -quit | grep -q .
      - name: Smoke-test packaged AppImage on X11 and Wayland
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"

          expect_running() {
            label=$1
            shift
            set +e
            "$@"
            status=$?
            set -e
            if [ "$status" -ne 124 ]; then
              echo "$label AppImage smoke test exited unexpectedly with status $status" >&2
              return 1
            fi
          }

          expect_running X11 xvfb-run -a \
            timeout --signal=TERM --kill-after=3s 8s \
            env APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=xcb "$appimage"

          wayland_runtime=$(mktemp -d)
          chmod 0700 "$wayland_runtime"
          weston_log="$wayland_runtime/weston.log"
          XDG_RUNTIME_DIR="$wayland_runtime" weston \
            --backend=headless-backend.so \
            --socket=wayland-whodis \
            --idle-time=0 \
            --use-pixman \
            --log="$weston_log" &
          weston_pid=$!
          cleanup_weston() {
            kill "$weston_pid" 2>/dev/null || true
            wait "$weston_pid" 2>/dev/null || true
          }
          trap cleanup_weston EXIT

          for _ in $(seq 1 50); do
            [ -S "$wayland_runtime/wayland-whodis" ] && break
            if ! kill -0 "$weston_pid" 2>/dev/null; then
              cat "$weston_log" >&2
              exit 1
            fi
            sleep 0.1
          done
          if [ ! -S "$wayland_runtime/wayland-whodis" ]; then
            cat "$weston_log" >&2
            echo "Weston did not create its Wayland socket" >&2
            exit 1
          fi

          expect_running Wayland \
            timeout --signal=TERM --kill-after=3s 8s \
            env APPIMAGE_EXTRACT_AND_RUN=1 \
            XDG_RUNTIME_DIR="$wayland_runtime" \
            WAYLAND_DISPLAY=wayland-whodis \
            QT_QPA_PLATFORM=wayland \
            "$appimage"

          cleanup_weston
          trap - EXIT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whodis-gui-linux-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  gui-windows:
    name: Build Windows GUI (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: amd64
            qt_arch: win64_msvc2022_64
            msvc_arch: x64
          - runner: windows-11-arm
            arch: arm64
            qt_arch: win64_msvc2022_arm64
            msvc_arch: amd64_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.10.2'
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Build and deploy
        shell: pwsh
        run: |
          $version = $env:WHODIS_BUILD_VERSION.TrimStart('v')
          cmake -S desktop -B build-gui -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" `
            -DWHODIS_VERSION="$version" `
            -DBUILD_TESTING=ON
          cmake --build build-gui --parallel
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --test-dir build-gui --output-on-failure
          cmake --install build-gui
          windeployqt --release --no-translations "$PWD/stage/bin/whodis-gui.exe"
          Copy-Item README.md, LICENSE, desktop/packaging/THIRD_PARTY_NOTICES.md -Destination "$PWD/stage/bin"
          Copy-Item "$PWD/desktop/packaging/qt-licenses" -Destination "$PWD/stage/bin/Qt-Licenses" -Recurse
          bash scripts/collect-go-licenses.sh stage/bin/Go-Licenses
          if (-not (Test-Path "$PWD/stage/bin/Qt-Licenses/LGPL-3.0-only.txt") -or
              -not (Test-Path "$PWD/stage/bin/Qt-Licenses/GPL-3.0-only.txt")) {
            throw "The deployed Windows package is missing Qt license texts."
          }
          New-Item -ItemType Directory -Path release-assets | Out-Null
          $sbomPath = "$PWD/release-assets/whodis-gui_windows_${{ matrix.arch }}.sbom.json"
          syft "dir:$PWD/stage/bin" --output "spdx-json=$sbomPath"
          $sbom = Get-Content -Raw -LiteralPath $sbomPath | ConvertFrom-Json
          if ($sbom.packages.Count -lt 10 -or -not (Select-String -Quiet -Pattern 'whodis' -LiteralPath $sbomPath)) {
            throw "The Windows staged-content SBOM is unexpectedly incomplete."
          }
          if (-not (Get-ChildItem "$PWD/stage/bin" -Recurse -Filter Qt6Core.dll)) {
            throw "The Windows deployment is missing Qt6Core.dll."
          }
          Compress-Archive -Path "$PWD/stage/bin/*" `
            -DestinationPath "release-assets/whodis-gui_windows_${{ matrix.arch }}_portable.zip"
          $makensis = & "$PWD/scripts/install-nsis.ps1"
          & $makensis `
            "/DAPP_SOURCE=$PWD\stage\bin" `
            "/DAPP_ICON=$PWD\desktop\resources\whodis.ico" `
            "/DVERSION=$version" `
            "/DOUTPUT_FILE=$PWD\release-assets\whodis-gui_windows_${{ matrix.arch }}_setup.exe" `
            desktop/packaging/windows/installer.nsi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whodis-gui-windows-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  gui-macos:
    name: Build universal macOS GUI
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.10.2'
          arch: clang_64
          cache: true
      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Build universal app and DMG
        shell: bash
        run: |
          set -euo pipefail
          version=${WHODIS_BUILD_VERSION#v}
          bundle_version=${version%%-*}
          iconset="$RUNNER_TEMP/Whodis.iconset"
          mkdir -p "$iconset"
          sips -z 16 16 docs/whodis_logo.png --out "$iconset/icon_16x16.png" >/dev/null
          sips -z 32 32 docs/whodis_logo.png --out "$iconset/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 docs/whodis_logo.png --out "$iconset/icon_32x32.png" >/dev/null
          sips -z 64 64 docs/whodis_logo.png --out "$iconset/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 docs/whodis_logo.png --out "$iconset/icon_128x128.png" >/dev/null
          sips -z 256 256 docs/whodis_logo.png --out "$iconset/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 docs/whodis_logo.png --out "$iconset/icon_256x256.png" >/dev/null
          sips -z 512 512 docs/whodis_logo.png --out "$iconset/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 docs/whodis_logo.png --out "$iconset/icon_512x512.png" >/dev/null
          sips -z 1024 1024 docs/whodis_logo.png --out "$iconset/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$iconset" -o "$RUNNER_TEMP/Whodis.icns"
          cmake -S desktop -B build-gui -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES='x86_64;arm64' \
            -DWHODIS_MACOS_ICON="$RUNNER_TEMP/Whodis.icns" \
            -DWHODIS_VERSION="$version" \
            -DWHODIS_BUNDLE_VERSION="$bundle_version" \
            -DBUILD_TESTING=ON
          cmake --build build-gui --parallel
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-gui --output-on-failure
          app=$(find build-gui/bin -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          mv "$app" build-gui/bin/Whodis.app
          app=build-gui/bin/Whodis.app
          mkdir -p "$app/Contents/Helpers" "$app/Contents/Resources"
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.version=$version -X github.com/Alex9001/whodis/v2.version=$version" -o /tmp/whodis-engine-amd64 ./cmd/whodis-gui-engine
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath \
            -ldflags="-s -w -X main.version=$version -X github.com/Alex9001/whodis/v2.version=$version" -o /tmp/whodis-engine-arm64 ./cmd/whodis-gui-engine
          lipo -create /tmp/whodis-engine-amd64 /tmp/whodis-engine-arm64 \
            -output "$app/Contents/Helpers/whodis-gui-engine"
          cp LICENSE README.md desktop/packaging/THIRD_PARTY_NOTICES.md "$app/Contents/Resources/"
          scripts/collect-qt-licenses.sh "$app/Contents/Resources/Qt-Licenses"
          scripts/collect-go-licenses.sh "$app/Contents/Resources/Go-Licenses"
          test -f "$app/Contents/Resources/Qt-Licenses/LGPL-3.0-only.txt"
          test -f "$app/Contents/Resources/Qt-Licenses/GPL-3.0-only.txt"
          macdeployqt "$app" -always-overwrite
          mkdir -p release-assets
          syft "dir:$app" \
            --output "spdx-json=release-assets/whodis-gui_macos_universal.sbom.json"
          jq --exit-status '.packages | length >= 10' \
            release-assets/whodis-gui_macos_universal.sbom.json
          grep -qi whodis release-assets/whodis-gui_macos_universal.sbom.json
          test -d "$app/Contents/Frameworks/QtCore.framework"
          hdiutil create -volname Whodis -srcfolder "$app" -ov -format UDZO \
            "release-assets/whodis-gui_macos_universal.dmg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whodis-gui-macos-universal
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Assemble, verify, and optionally publish release
    needs:
      - gui-linux
      - gui-windows
      - gui-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: whodis-gui-*
          path: .release-assets/gui
          merge-multiple: true
      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Vet, test, and analyze release source
        run: |
          go vet ./...
          go test -race ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -exclude-generated -quiet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: List unsigned GUI assets
        run: |
          echo 'Desktop packages are intentionally unsigned.'
          find .release-assets/gui -maxdepth 1 -type f -print
      - name: Prepare non-publishing preflight version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          PREFLIGHT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=${PREFLIGHT_VERSION#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $PREFLIGHT_VERSION" >&2
            exit 2
          fi
          git tag --force "v$version"
      - name: Assemble CLI and native packages without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify staged release identities and SBOMs
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/checksums.txt
          grep -q 'whodis-gui_' dist/checksums.txt
          for sbom in .release-assets/gui/*.sbom.json; do
            jq --exit-status '.packages | length >= 10' "$sbom" >/dev/null
            grep -qi whodis "$sbom"
          done
          test "$(find .release-assets/gui -maxdepth 1 -type f -name '*.sbom.json' | wc -l)" -eq 5
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=${GITHUB_REF_NAME#v}
            cli=$(find dist -type f -path '*linux_amd64*/whodis' -print -quit)
            test -n "$cli"
            test "$("$cli" --version)" = "whodis $version"
          fi
      - name: Upload private preflight bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whodis-${{ inputs.version }}-release-preflight
          path: |
            dist/**/*
            .release-assets/gui/*
            scripts/install.sh
            scripts/install.ps1
          if-no-files-found: error
      - name: Attest release artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.apk
            dist/**/*.pkg.tar.zst
            dist/**/*.sbom*
            dist/checksums.txt
            .release-assets/gui/*
            scripts/install.sh
            scripts/install.ps1
      - name: Publish the already verified and attested files
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find dist -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*.apk' -o -name '*.pkg.tar.zst' \
               -o -name '*.sbom*' -o -name 'checksums.txt' \) -print0)
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(find .release-assets/gui -maxdepth 1 -type f -print0)
          assets+=(scripts/install.sh scripts/install.ps1)

          notes=(--generate-notes)
          release_notes_file=".github/RELEASE_NOTES.md"
          if [ -f "$release_notes_file" ] && \
             grep -Fqx "# Whodis ${GITHUB_REF_NAME}" "$release_notes_file"; then
            notes=(--notes-file "$release_notes_file")
          fi
          release_kind=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_kind=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Whodis ${GITHUB_REF_NAME#v}" \
            "${notes[@]}" "${release_kind[@]}" "${assets[@]}"

  publish-aur:
    name: Update AUR packages
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for AUR credentials
        id: aur
        shell: bash
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          if [[ -n "$AUR_KEY" && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AUR publishing skipped: no deploy key or this is a prerelease tag."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.aur.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - name: Download published source and checksums
        if: steps.aur.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" \
            --pattern checksums.txt \
            --pattern 'whodis_*_source.tar.gz' \
            --dir dist
      - name: Publish CLI and GUI AUR packages
        if: steps.aur.outputs.enabled == 'true'
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          scripts/publish-aur.sh "$GITHUB_REF_NAME" dist/checksums.txt
          scripts/publish-aur-gui.sh "$GITHUB_REF_NAME" dist/checksums.txt

  publish-container:
    name: Publish OCI image
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/alex9001/whodis
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
