version: 2

project_name: whodis

gomod:
  dir: ./v2

before:
  hooks:
    - ./scripts/collect-go-licenses.sh .release-assets/go-licenses

builds:
  - id: whodis
    dir: ./v2
    main: ./cmd/whodis
    binary: whodis
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X github.com/Alex9001/whodis/v2.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64

archives:
  - id: whodis
    ids:
      - whodis
    name_template: whodis_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - src: docs/MIGRATING_TO_V2.md
        dst: MIGRATING_TO_V2.md
      - LICENSE
      - src: ./.release-assets/go-licenses/*
        dst: Go-Licenses

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/install.ps1
    - glob: ./.release-assets/gui/*

nfpms:
  - id: whodis-packages
    ids:
      - whodis
    package_name: whodis
    vendor: Cyberbrand
    homepage: https://cyberbrand.net/whodis/
    maintainer: Aleksandr Oreshkin
    description: Evidence-backed domain investigation with RDAP, WHOIS, RWhois, and DNS.
    license: MIT
    bindir: /usr/bin
    section: utils
    priority: optional
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    contents:
      - src: ./LICENSE
        dst: /usr/share/licenses/whodis/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/whodis/README.md
      - src: ./docs/MIGRATING_TO_V2.md
        dst: /usr/share/doc/whodis/MIGRATING_TO_V2.md
      - src: ./.release-assets/go-licenses
        dst: /usr/share/licenses/whodis/third-party
        type: tree

sboms:
  - id: archives
    artifacts: archive
    disable: false
  - id: packages
    artifacts: package
    disable: false

source:
  enabled: true
  name_template: whodis_{{ .Version }}_source
  prefix_template: whodis_{{ .Version }}/

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^Merge '

release:
  prerelease: auto
  mode: replace
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/install.ps1
    - glob: ./.release-assets/gui/*
