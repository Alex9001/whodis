version: 2

project_name: whodis

builds:
  - id: whodis
    main: ./cmd/whodis
    binary: whodis
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: whodis
    ids:
      - whodis
    name_template: whodis_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/install.ps1

source:
  enabled: true
  name_template: whodis_{{ .Version }}_source
  prefix_template: whodis_{{ .Version }}/

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^Merge '

release:
  prerelease: auto
  mode: replace
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/install.ps1
